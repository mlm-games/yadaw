[package]
name = "yadaw-plugin-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Plugin host for YADAW (CLAP/LV2/VST3)."
publish = false

[target.'cfg(unix)'.dependencies]
x11-dl = "2.21"

[dependencies]
anyhow.workspace = true
dashmap.workspace = true
log.workspace = true
once_cell.workspace = true
parking_lot.workspace = true
smallvec.workspace = true

yeli = { version = "0.4", optional = true }

yadaw-plugin-api.workspace = true

vst3-host = { version = "0.10", optional = true, default-features = false, features = [
    "egui-widgets",
] }

[features]
default = []
clap-host = ["clack-extensions", "clack-host"]
lv2-legacy = ["yeli"]
vst3-host = ["dep:vst3-host"]

[dependencies.clack-host]
git = "https://github.com/prokopyl/clack"
package = "clack-host"
branch = "main"
optional = true

[dependencies.clack-extensions]
git = "https://github.com/prokopyl/clack"
package = "clack-extensions"
branch = "main"
optional = true
default-features = false
features = [
    "params",
    "gui",
    "raw-window-handle_06",
    "clack-host",
    "timer",
    "log",
]
