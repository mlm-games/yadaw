name: Release binaries

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - none
          - patch
          - minor
          - major
      mark_prerelease:
        description: "Mark as prerelease"
        required: true
        default: false
        type: boolean
      upload_play:
        description: "Upload AAB to Play Store"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: release-bin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: mlm-games/ci/.github/workflows/rust-app-release.yml@v1
    with:
      working-directory: .
      app-name: ""
      app-slug: "yadaw"
      # This workflow owns the bump + tag; it dispatches the other release
      # workflows with the bumped version_name afterwards.
      bump-type: ${{ inputs.bump_type }}
      include-android: true
      include-universal: true
      prerelease: ${{ inputs.mark_prerelease }}
      generate-release-notes: true
      changelog-path: "CHANGELOG.md"
      version-file-path: "./fastlane/metadata/android/en-US/changelogs/{{version_code}}.txt"
      metainfo-path: "./others/flathub/io.github.mlm_games.yadaw.metainfo.xml"
      dispatch-on-release: '["crate-publish.yml","aur-upload.yml","snap-upload.yml"]'
      android-api: "37.0"
      android-build-tools: "37.0.0"
      android-ndk-version: "29.0.14206865"
      cargo-rapk-version: "0.20.1"
      android-d8-version: ""
    secrets: inherit

  play-upload:
    needs: release
    if: ${{ !inputs.mark_prerelease && inputs.upload_play }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-universal*
          merge-multiple: true
          path: dist
      - name: Upload to Play Store (production)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.mlm.yadaw
          releaseFiles: dist/*.aab
          track: production
          whatsNewDirectory: fastlane/metadata/android
