name: Release binaries

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version to build (informational; crate-publish.yml owns the bump + tag)"
        required: false
        type: string
      mark_prerelease:
        description: "Mark as prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: release-bin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: mlm-games/ci/.github/workflows/rust-app-release.yml@v1
    with:
      working-directory: .
      app-name: "YADAW"
      app-slug: "yadaw"
      # Version is bumped + tagged by crate-publish.yml before dispatching this
      # workflow; build the binaries at that version.
      bump-type: none
      include-android: true
      prerelease: ${{ inputs.mark_prerelease }}
      generate-release-notes: true
      changelog-path: "CHANGELOG.md"
      version-file-path: "./fastlane/metadata/android/en-US/changelogs/{{version_code}}.txt"
      metainfo-path: "./others/flathub/io.github.mlm_games.yadaw.metainfo.xml"
      dispatch-on-release: '["aur-upload.yml"]'
    secrets: inherit