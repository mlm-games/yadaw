name: Release binaries

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - none
          - patch
          - minor
          - major
      mark_prerelease:
        description: "Mark as prerelease"
        required: true
        default: false
        type: boolean
      upload_play:
        description: "Upload AAB to Play Store"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: release-bin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: mlm-games/ci/.github/workflows/rust-app-release.yml@v1
    with:
      working-directory: .
      app-name: ""
      app-slug: "yadaw"
      # This workflow owns the bump + tag; it dispatches the other release
      # workflows with the bumped version_name afterwards.
      bump-type: ${{ inputs.bump_type }}
      include-android: true
      include-universal: true
      prerelease: ${{ inputs.mark_prerelease }}
      generate-release-notes: true
      changelog-path: "CHANGELOG.md"
      version-file-path: "./fastlane/metadata/android/en-US/changelogs/{{version_code}}.txt"
      metainfo-path: "./others/flathub/io.github.mlm_games.yadaw.metainfo.xml"
      dispatch-on-release: '["crate-publish.yml","aur-upload.yml","snap-upload.yml"]'
      android-api: "37.0"
      android-build-tools: "37.0.0"
      android-ndk-version: "29.0.14206865"
      cargo-rapk-version: "0.22.1"
      kotlin-version: "2.2.10"
      android-d8-version: ""
    secrets: inherit

  play-upload:
    needs: release
    if: ${{ !inputs.mark_prerelease && inputs.upload_play }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-universal*
          merge-multiple: true
          path: dist

      # upload-google-play wants whatsnew-<LOCALE> files, while the release
      # notes are stored fastlane-style as changelogs/<version_code>.txt.
      - name: Stage release notes for Play
        shell: bash
        run: |
          set -euo pipefail
          SRC="fastlane/metadata/android/en-US/changelogs/${{ needs.release.outputs.version_code }}.txt"
          if [[ ! -f "$SRC" ]]; then
            echo "::warning::No changelog at $SRC; uploading without release notes" >&2
            exit 0
          fi
          mkdir -p dist-play/whatsnew
          cp "$SRC" dist-play/whatsnew/whatsnew-en-US
          echo "Staged release notes from $SRC"

      - name: Upload to Play Store (production)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.mlm.yadaw
          releaseFiles: dist/*.aab
          tracks: production
          whatsNewDirectory: dist-play/whatsnew
