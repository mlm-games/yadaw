name: Publish crates

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version to publish (informational; release.yml owns the bump + tag)"
        required: false
        type: string

concurrency:
  group: crate-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  publish:
    uses: mlm-games/ci/.github/workflows/crate-publish.yml@v1
    with:
      working-directory: .
      # Version + tag are owned by release.yml; this just publishes the
      # workspace crates at the bumped version already in Cargo.toml.
      bump-type: none
      write-android-version-code: true
      publish-crates-io: true
      workspace-publish: true
      workspace-exclude: "yadaw yadaw-plugin-host"
      generate-release-notes: false
      create-release: false
      system-deps: libasound2-dev libudev-dev pkg-config libx11-dev libxcb1-dev libxi-dev libxinerama-dev libxrandr-dev libxcursor-dev