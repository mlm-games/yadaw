name: Publish to AUR

# Thin dispatcher: rust-app-release dispatches here with version_name,
# we delegate to the shared reusable (desktop entry + icon included).
# Desktop Categories/MimeType taken from others/flathub/io.github.mlm_games.yadaw.desktop.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g., 0.2.9)'
        required: true

jobs:
  update-aur:
    uses: mlm-games/ci/.github/workflows/aur-upload.yml@v1
    with:
      pkgname: yadaw-bin
      pkgdesc: "Yet Another mini-DAW - a lightweight sfx tool in pure Rust (binary)"
      binary-name: yadaw-${{ inputs.version_name }}-x86_64-unknown-linux-gnu.tar.gz
      binary-name-aarch64: yadaw-${{ inputs.version_name }}-aarch64-unknown-linux-gnu.tar.gz
      app-name: "Yadaw"
      license: "AGPL-3.0-only"
      depends: "alsa-lib libx11 libxcursor libxinerama libxrandr libxi"
      optdepends: "'pipewire-pulse: for PipeWire audio support' 'pulseaudio: for PulseAudio audio support'"
      provides: "yadaw clap-host lv2-host"
      conflicts: "yadaw"
      desktop-comment: "Lightweight mini-DAW for sound design and prototyping with LV2/CLAP plugin support"
      desktop-categories: "AudioVideo;Audio;Music;Sequencer;Midi;"
      desktop-mime-type: "audio/midi;audio/x-midi;audio/wav;audio/x-wav;audio/flac;audio/mpeg;audio/ogg;"
      desktop-args: "%F"
      icon-url: "https://raw.githubusercontent.com/mlm-games/yadaw/master/fastlane/metadata/android/en-US/images/icon.png"
      version: ${{ inputs.version_name }}
      maintainer-name: "MLM-stuff"
      maintainer-email: "gfxoxinzh@mozmail.com"
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
